version: "2"

linters:
  default: standard
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*database/sql.Tx).Rollback
        - (*database/sql.Rows).Close
        - (*database/sql.DB).Close
        - (*url-shortener/internal/store.Store).Close

run:
  timeout: 5m
