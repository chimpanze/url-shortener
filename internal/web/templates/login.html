{{define "content"}}
<h1>Admin login</h1>
{{if .Flash}}<p class="error">{{.Flash}}</p>{{end}}
<form method="post" action="/admin/login">
  <label>Password<input type="password" name="password" autocomplete="current-password" autofocus></label>
  <button type="submit">Log in</button>
</form>
{{end}}
